name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: get finals
      run: cd its-rs && wget https://datacenter.iers.org/data/9/finals2000A.all
    - name: Run tests
      run: cargo test --verbose
